name: Release

# Pushing a tag like v0.2.0 builds Grimm, signs it with the Developer ID
# certificate, has Apple notarise it, signs the update, and publishes a GitHub
# release. Installed copies find it through latest.json on that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # codesign needs Apple's Developer ID intermediate to complete the
      # certificate's chain; the .p12 carries only the certificate and its key.
      - name: Install the Developer ID intermediate certificate
        run: |
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true

      # The notarisation key has to be a file on disk. The secret may hold the
      # .p8 as it is or base64-encoded, and pasting it can flatten its line
      # breaks, so it is rebuilt as a proper PEM and checked before use.
      - name: Write the App Store Connect API key
        run: |
          # Bytes, not characters: a mangled secret must reach the check below, not trip sed.
          export LC_ALL=C
          key=$(printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r')
          if [ -z "$key" ]; then
            echo "::error::The APPLE_API_KEY_P8 secret is empty"; exit 1
          fi
          if ! grep -q "BEGIN PRIVATE KEY" <<< "$key"; then
            key=$(printf '%s' "$key" | tr -d ' \n\t' | base64 --decode)
          fi
          body=$(printf '%s' "$key" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout 2> /dev/null; then
            echo "::error::APPLE_API_KEY_P8 isn't a .p8 private key. Set it to the contents of the AuthKey_*.p8 file from App Store Connect."; exit 1
          fi
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signing: the Developer ID Application certificate, exported as a base64 .p12.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarisation: an App Store Connect API key (APPLE_API_KEY_PATH is set above).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Grimm v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          # Update artifacts and the Developer ID signature are only produced here, so
          # local builds need neither key and stay ad-hoc signed. The identity must be
          # part of the certificate's name; the team ID is, and has no spaces to split on.
          args: >-
            --target universal-apple-darwin
            --config {"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"GUYKRR7HTA"}}}
