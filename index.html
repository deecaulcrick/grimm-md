<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimm</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-top" data-tauri-drag-region></div>
        <nav class="sidebar-actions">
          <button id="btn-new" class="nav-item"><i data-lucide="plus"></i><span>New document</span><kbd>⌘N</kbd></button>
          <button id="btn-open" class="nav-item"><i data-lucide="file-text"></i><span>Open file</span><kbd>⌘O</kbd></button>
          <button id="btn-folder" class="nav-item"><i data-lucide="folder-open"></i><span>Open folder</span><kbd>⇧⌘O</kbd></button>
        </nav>
        <div class="sidebar-scroll">
          <section id="folder-section" hidden>
            <header>
              <h2 id="folder-name"></h2>
              <button id="btn-close-folder" class="icon-btn small" title="Close folder"><i data-lucide="x"></i></button>
            </header>
            <ul id="folder-list" class="file-list"></ul>
          </section>
          <section id="recent-section" hidden>
            <header><h2>Recents</h2></header>
            <ul id="recent-list" class="file-list"></ul>
          </section>
        </div>
        <nav class="sidebar-foot">
          <button id="btn-help" class="nav-item"><i data-lucide="circle-question-mark"></i><span>Help</span></button>
        </nav>
      </aside>

      <div id="sidebar-resizer" title="Drag to resize, double-click to reset"></div>

      <main id="main">
        <div id="panes"></div>
        <footer id="statusbar">
          <span id="doc-path"></span>
          <span id="doc-stats"></span>
        </footer>
      </main>
    </div>
    <div id="appearance" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
