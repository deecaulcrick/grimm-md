<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimm</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-top" data-tauri-drag-region>
          <button id="btn-sidebar" class="icon-btn" title="Close sidebar (⌘\)"><i data-lucide="panel-left"></i></button>
          <span class="sidebar-gap" data-tauri-drag-region></span>
          <button id="btn-compose" class="icon-btn" title="New note (⌘N)"><i data-lucide="square-pen"></i></button>
        </div>
        <label class="side-search">
          <i data-lucide="search"></i>
          <input id="side-search" placeholder="Search notes" spellcheck="false" autocomplete="off" />
          <kbd>⌘K</kbd>
        </label>
        <nav class="sidebar-actions">
          <button id="btn-open" class="nav-item"><i data-lucide="file-text"></i><span>Open file</span><kbd>⌘O</kbd></button>
          <button id="btn-folder" class="nav-item"><i data-lucide="folder-open"></i><span>Open folder</span><kbd>⇧⌘O</kbd></button>
        </nav>
        <div class="sidebar-scroll">
          <div id="side-sections"></div>
          <p id="search-empty" class="search-empty" hidden>No notes match</p>
        </div>
        <footer class="sidebar-foot">
          <button id="btn-help" class="nav-item foot-help"><i data-lucide="circle-question-mark"></i><span>Help</span></button>
          <button id="btn-theme" class="icon-btn" title="Theme"><i data-lucide="palette"></i></button>
        </footer>
      </aside>

      <div id="sidebar-resizer" title="Drag to resize, double-click to reset"></div>

      <main id="main">
        <div id="panes"></div>
        <footer id="statusbar">
          <span id="doc-path"></span>
          <span id="doc-stats"></span>
        </footer>
      </main>
    </div>
    <div id="appearance" hidden></div>
    <div id="share-menu" hidden></div>
    <div id="shared-pages" hidden></div>
    <div id="history" hidden></div>
    <div id="commit-menu" hidden></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
